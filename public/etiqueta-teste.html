  .info p { margin:2px 0; font-size:1.3em; }
  .info .rotulo { font-weight:bold; }
  .qrcode { width:22%; flex-shrink:0; background:#ffffff; }
  .qrcode img { width:100%; display:block; background:#ffffff; }
  .rodape { position:relative; z-index:1; text-align:center; height:22%; display:flex; align-items:center; justify-content:center; background:#ffffff; }
  .rodape img { height:100%; width:auto; max-width:96%; background:#ffffff; }
